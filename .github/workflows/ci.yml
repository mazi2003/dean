name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dean
          POSTGRES_PASSWORD: ci_test_pg_password
          POSTGRES_DB: dean
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dean -d dean"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify mirrored Prisma schema parity
        run: cmp -s database/schema.prisma backend/prisma/schema.prisma

      - name: Install Database dependencies & verify schema
        working-directory: database
        env:
          DATABASE_URL: postgresql://dean:ci_test_pg_password@localhost:5432/dean?schema=public
          TEST_DATABASE_URL: postgresql://dean:ci_test_pg_password@localhost:5432/dean?schema=public
          SEED_STUDENT_PASSWORD: CiTestStudentPass123!
          SEED_STAFF_PASSWORD: CiTestStaffPass123!
        run: |
          npm ci
          npm run db:generate
          npm run typecheck
          npm run lint
          npm run format:check
          npm run db:migrate:deploy
          npm run db:seed
          npm test

      - name: Install Backend dependencies, test & build
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build:tsc

      - name: Install Frontend dependencies, test & build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
