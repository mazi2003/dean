<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142D4E" />
    <meta name="description" content="DemoTech University • Цифровой деканат: личный кабинет студента, расписание, зачетная книжка, справки с ЭЦП и консультант деканата." />
    
    <!-- Self-hosted Typography System (OFL-1.1): Inter & JetBrains Mono bundled locally -->

    <title>DemoTech • Цифровой деканат</title>
    <script>
      try {
        var t = localStorage.getItem('dean_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-academic-green selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
