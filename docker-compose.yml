services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dean
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: dean
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dean"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
  web:
    build: ./frontend
    depends_on: [api]
  proxy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", caddydata:/data]
    depends_on: [web, api]
volumes:
  dbdata:
  caddydata:
