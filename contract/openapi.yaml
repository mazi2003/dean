openapi: 3.0.3
info:
  title: Digital Dean's Office API (competition concept, fictional data)
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dean_session
  responses:
    Unauthorized:
      description: Not authenticated
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Wrong role
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found OR not owned by caller (never reveal existence)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string }
        details: { type: object }
    Role: { type: string, enum: [student, staff] }
    User:
      type: object
      required: [id, email, fullName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Profile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            faculty: { type: string, nullable: true }
            program: { type: string, nullable: true }
            year: { type: integer, nullable: true }
            group: { type: string, nullable: true }
            studentNumber: { type: string, nullable: true, description: Fictional only }
            studyForm: { type: string, enum: [Бюджет, Контракт], nullable: true }
            averageScore: { type: number, nullable: true }
            gpa: { type: number, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    ScheduleEntry:
      type: object
      required: [id, date, start, end, subject, status]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        start: { type: string, example: '08:30' }
        end: { type: string, example: '10:05' }
        subject: { type: string }
        type: { type: string, enum: [lecture, seminar, lab, exam] }
        room: { type: string }
        teacher: { type: string }
        status: { type: string, enum: [normal, room_changed, moved, cancelled] }
        changeNote: { type: string, nullable: true }
    Grade:
      type: object
      required: [id, subject, credits, assessmentType, creditStatus]
      properties:
        id: { type: string }
        subject: { type: string }
        credits: { type: integer }
        assessmentType: { type: string, enum: [exam, credit, coursework] }
        points: { type: integer, minimum: 0, maximum: 100, nullable: true }
        grade: { type: integer, enum: [2, 3, 4, 5], nullable: true }
        creditStatus: { type: string, enum: [earned, in_progress, failed] }
        examDate: { type: string, format: date, nullable: true }
    GradesSummary:
      type: object
      properties:
        semester: { type: integer }
        averagePoints: { type: number }
        gpa: { type: number }
        creditsEarned: { type: integer }
        creditsRequired: { type: integer }
        upcomingExams: { type: array, items: { $ref: '#/components/schemas/Grade' } }
        items: { type: array, items: { $ref: '#/components/schemas/Grade' } }
    RequestType:
      type: object
      properties:
        code: { type: string, enum: [study_certificate, military_certificate, scholarship_application, academic_leave, transcript, dormitory_application] }
        title: { type: string }
        description: { type: string }
        slaDays: { type: integer }
        fields:
          type: array
          items:
            type: object
            required: [name, label, type, required]
            properties:
              name: { type: string }
              label: { type: string }
              labelEn: { type: string }
              type: { type: string, enum: [text, textarea, select, number, date] }
              required: { type: boolean }
              placeholder: { type: string }
              options: { type: array, items: { type: string } }
              optionsEn: { type: array, items: { type: string } }
    RequestStatus: { type: string, enum: [submitted, in_review, needs_info, ready, rejected, cancelled] }
    StatusEvent:
      type: object
      properties:
        status: { $ref: '#/components/schemas/RequestStatus' }
        at: { type: string, format: date-time }
        comment: { type: string, nullable: true }
    CreateRequest:
      type: object
      required: [typeCode, data]
      properties:
        typeCode: { type: string }
        data: { type: object, additionalProperties: true }
    Request:
      type: object
      properties:
        id: { type: string, format: uuid }
        typeCode: { type: string }
        typeTitle: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expectedBy: { type: string, format: date, nullable: true }
        data: { type: object }
        history: { type: array, items: { $ref: '#/components/schemas/StatusEvent' } }
        student: { $ref: '#/components/schemas/User' }
    NotificationKind: { type: string, enum: [announcement, deadline, request_update, schedule_change] }
    Notification:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        title: { type: string }
        body: { type: string }
        message: { type: string }
        priority: { type: string, enum: [normal, high, urgent] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        link: { type: string, nullable: true }
    ExamStatus: { type: string, enum: [scheduled, date_changed, room_changed, postponed, cancelled] }
    ExamEntry:
      type: object
      required: [id, code, groupId, subject, format, examiner, date, rawDate, time, room, consultation, credits, status, isDebt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        groupId: { type: string }
        subject: { type: string }
        format: { type: string }
        examiner: { type: string }
        commissionMembers: { type: string }
        date: { type: string }
        rawDate: { type: string, format: date }
        time: { type: string }
        room: { type: string }
        consultation: { type: string }
        credits: { type: integer }
        status: { $ref: '#/components/schemas/ExamStatus' }
        changeNote: { type: string, nullable: true }
        retakeDate: { type: string, nullable: true }
        isDebt: { type: boolean }
    Page:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
paths:
  /health:
    get:
      security: []
      summary: Service liveness and optional PostgreSQL/seed check (GET /api/v1/health)
      parameters:
        - { name: db, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  db: { type: string, enum: [ok] }
                  seeded: { type: boolean }
        '503':
          description: Database unreachable when ?db=1 is requested
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, db, seeded]
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  db: { type: string, enum: [error] }
                  seeded: { type: boolean, example: false }
  /auth/login:
    post:
      security: []
      summary: Login; sets httpOnly cookie. Rate limited (429).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many attempts }
  /auth/logout:
    post:
      summary: Clears cookie
      responses: { '204': { description: Logged out } }
  /auth/me:
    get:
      summary: Current user
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile:
    get:
      summary: Own profile (student or staff)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /schedule:
    get:
      summary: Schedule for a date range or specific day (students get own group; staff may filter by group)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: group, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduleEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /schedule/today:
    get:
      summary: Own classes today plus next upcoming class
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { today: { type: array, items: { $ref: '#/components/schemas/ScheduleEntry' } }, next: { $ref: '#/components/schemas/ScheduleEntry' } } } } } }
  /exams:
    get:
      summary: Exams schedule (students get own group; staff may filter by ?group=)
      parameters:
        - { name: group, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /grades:
    get:
      summary: Own grades and credits (optional semester)
      parameters:
        - { name: semester, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GradesSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /request-types:
    get:
      summary: Available request types and form fields
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RequestType' } } } } }
  /requests:
    get:
      summary: Own requests (newest first)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequestStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Request' } } } } ] } } } }
    post:
      summary: Create request (student only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /requests/{id}:
    get:
      summary: Own request with history. Foreign id -> 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /requests/{id}/cancel:
    post:
      summary: Cancel own request while submitted or in_review
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not cancellable in current status }
  /notifications:
    get:
      summary: Own notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/NotificationKind' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Page' }, { type: object, properties: { unreadCount: {type: integer}, items: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } ] } } } }
  /notifications/{id}/read:
    post:
      summary: Mark own notification read
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      summary: Mark all own notifications read
      responses: { '204': { description: OK } }
  /assistant/ask:
    post:
      summary: Server-side Academic Advisor (deterministic rules engine by default + optional server-side OpenAI-compatible LLM); answers only from caller's own data.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [question], properties: { question: { type: string, maxLength: 500 }, lang: { type: string, enum: [ru, en] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { answer: { type: string }, source: { type: string, enum: [rules, llm] } } } } } }
  /staff/requests:
    get:
      summary: Staff only. All requests with filters.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RequestStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Request' } } } } ] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/requests/{id}/status:
    post:
      summary: Staff only. Change status (valid transitions only); creates notification for the student.
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/RequestStatus' }, comment: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Invalid transition }
  /staff/announcements:
    get:
      summary: Staff only. List published announcements journal.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: {type: string}, title: {type: string}, body: {type: string}, targetGroup: {type: string, nullable: true}, createdAt: {type: string, format: date-time} } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Staff only. Post announcement to all students, one group, or one user.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, body], properties: { title: {type: string}, body: {type: string}, group: {type: string, nullable: true}, targetUserId: {type: string, nullable: true}, priority: {type: string, enum: [normal, high, urgent]}, kind: {type: string} } } } } }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/announcements/{id}:
    delete:
      summary: Staff only. Revoke/delete a published announcement.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/schedule-changes:
    post:
      summary: Staff only. Change room/time/cancel/restore a class; optionally notifies the affected group.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scheduleEntryId, status], properties: { scheduleEntryId: {type: string}, status: {type: string, enum: [normal, room_changed, moved, cancelled]}, room: {type: string}, start: {type: string}, end: {type: string}, note: {type: string}, notifyGroup: {type: boolean} } } } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/exams:
    get:
      summary: Staff only. List exam session schedule (optional ?group=CODE).
      parameters: [ { name: group, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamEntry' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Staff only. Create a new exam entry and optionally notify the group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, groupId, subject, format, examiner, date, time, room]
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
                groupId: { type: string, minLength: 1 }
                subject: { type: string, minLength: 1, maxLength: 200 }
                format: { type: string, minLength: 1, maxLength: 200 }
                examiner: { type: string, minLength: 1, maxLength: 200 }
                commissionMembers: { type: string, maxLength: 300 }
                date: { type: string, minLength: 1, maxLength: 100 }
                rawDate: { type: string }
                time: { type: string, minLength: 1, maxLength: 60 }
                room: { type: string, minLength: 1, maxLength: 100 }
                consultation: { type: string, maxLength: 200, default: '' }
                credits: { type: integer, minimum: 1, maximum: 12, default: 4 }
                status: { $ref: '#/components/schemas/ExamStatus' }
                changeNote: { type: string, nullable: true }
                isDebt: { type: boolean, default: false }
                notifyGroup: { type: boolean, default: true }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExamEntry' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /staff/exams/{id}/reset:
    post:
      summary: Staff only. Restore an exam entry to its original seeded snapshot.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /staff/exam-changes:
    post:
      summary: Staff only. Update exam schedule/room/commission and optionally notify group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [examId]
              properties:
                examId: { type: string }
                date: { type: string }
                time: { type: string }
                room: { type: string }
                status: { type: string, enum: [scheduled, date_changed, room_changed, postponed, cancelled] }
                changeNote: { type: string, nullable: true }
                notifyGroup: { type: boolean }
                targetGroup: { type: string }
                subject: { type: string }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /staff/groups:
    get:
      summary: Staff only. Academic groups directory with summary statistics.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/groups/{code}/students:
    get:
      summary: Staff only. Student roster for an academic group.
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /staff/students:
    get:
      summary: Staff only. Full student directory across all groups.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/students/{id}/dossier:
    get:
      summary: Staff only. Full personal student dossier (profile, grades, requests).
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
